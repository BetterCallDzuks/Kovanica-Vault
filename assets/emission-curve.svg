<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320" role="img" aria-label="Kovanica Frozen Emission Schedule">
  <rect width="920" height="320" rx="14" fill="#121214" stroke="#2a2a30"/>
  <text x="32" y="38" fill="#F2A900" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">FROZEN EMISSION CURVE · 8,200,000 BLOCKS / ERA · 3/4 GEOMETRIC DECAY</text>
  <text x="32" y="60" fill="#9a9aa3" font-family="system-ui, sans-serif" font-size="13">Initial block reward: 2.500 KVNC (Era 0) · Fee split: 75% burned / 25% miner</text>

  <!-- Grid lines -->
  <g stroke="#2a2a30" stroke-width="1" stroke-dasharray="3,4">
    <line x1="70" y1="90" x2="620" y2="90"/>
    <line x1="70" y1="135" x2="620" y2="135"/>
    <line x1="70" y1="180" x2="620" y2="180"/>
    <line x1="70" y1="225" x2="620" y2="225"/>
    <line x1="70" y1="270" x2="620" y2="270"/>
  </g>

  <!-- Y Axis Labels -->
  <g fill="#6b6b74" font-family="ui-monospace, monospace" font-size="11" text-anchor="end">
    <text x="60" y="94">2.50</text>
    <text x="60" y="139">1.88</text>
    <text x="60" y="184">1.25</text>
    <text x="60" y="229">0.63</text>
    <text x="60" y="274">0.00</text>
  </g>

  <!-- Bars for Eras 0..9: height = (2.5 * (0.75^n)) / 2.5 * 180 -->
  <g font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">
    <!-- Era 0: 2.500 -> h=180 -->
    <rect x="82" y="90" width="38" height="180" rx="4" fill="#F2A900"/>
    <text x="101" y="288" fill="#9a9aa3">E0</text>
    <text x="101" y="84" fill="#f2f1ee">2.50</text>

    <!-- Era 1: 1.875 -> h=135 -->
    <rect x="134" y="135" width="38" height="135" rx="4" fill="#F2A900" fill-opacity="0.88"/>
    <text x="153" y="288" fill="#9a9aa3">E1</text>
    <text x="153" y="129" fill="#9a9aa3">1.88</text>

    <!-- Era 2: 1.406 -> h=101 -->
    <rect x="186" y="169" width="38" height="101" rx="4" fill="#F2A900" fill-opacity="0.78"/>
    <text x="205" y="288" fill="#9a9aa3">E2</text>
    <text x="205" y="163" fill="#9a9aa3">1.41</text>

    <!-- Era 3: 1.055 -> h=76 -->
    <rect x="238" y="194" width="38" height="76" rx="4" fill="#F2A900" fill-opacity="0.68"/>
    <text x="257" y="288" fill="#9a9aa3">E3</text>

    <!-- Era 4: 0.791 -> h=57 -->
    <rect x="290" y="213" width="38" height="57" rx="4" fill="#2fbaa4" fill-opacity="0.85"/>
    <text x="309" y="288" fill="#9a9aa3">E4</text>

    <!-- Era 5: 0.593 -> h=43 -->
    <rect x="342" y="227" width="38" height="43" rx="4" fill="#2fbaa4" fill-opacity="0.75"/>
    <text x="361" y="288" fill="#9a9aa3">E5</text>

    <!-- Era 6: 0.445 -> h=32 -->
    <rect x="394" y="238" width="38" height="32" rx="4" fill="#2fbaa4" fill-opacity="0.65"/>
    <text x="413" y="288" fill="#9a9aa3">E6</text>

    <!-- Era 7: 0.334 -> h=24 -->
    <rect x="446" y="246" width="38" height="24" rx="4" fill="#8aa0b4" fill-opacity="0.85"/>
    <text x="465" y="288" fill="#9a9aa3">E7</text>

    <!-- Era 8: 0.250 -> h=18 -->
    <rect x="498" y="252" width="38" height="18" rx="4" fill="#8aa0b4" fill-opacity="0.72"/>
    <text x="517" y="288" fill="#9a9aa3">E8</text>

    <!-- Era 9: 0.188 -> h=14 -->
    <rect x="550" y="256" width="38" height="14" rx="4" fill="#8aa0b4" fill-opacity="0.6"/>
    <text x="569" y="288" fill="#9a9aa3">E9</text>
  </g>

  <!-- Right-side Fee Split Panel -->
  <rect x="655" y="88" width="235" height="186" rx="10" fill="#1a1a1e" stroke="#2a2a30"/>
  <text x="675" y="114" fill="#f2f1ee" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5">TX FEE SPLIT (FROZEN)</text>

  <text x="675" y="148" fill="#F2A900" font-family="ui-monospace, monospace" font-size="22" font-weight="700">75% BURN</text>
  <rect x="675" y="158" width="195" height="10" rx="5" fill="#09090b"/>
  <rect x="675" y="158" width="146" height="10" rx="5" fill="#F2A900"/>

  <text x="675" y="206" fill="#2fbaa4" font-family="ui-monospace, monospace" font-size="22" font-weight="700">25% MINER</text>
  <rect x="675" y="216" width="195" height="10" rx="5" fill="#09090b"/>
  <rect x="675" y="216" width="49" height="10" rx="5" fill="#2fbaa4"/>

  <text x="675" y="254" fill="#9a9aa3" font-family="system-ui, sans-serif" font-size="11">EIP-1559 dynamic base fee + deposit</text>
</svg>
