<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Kovanica Protocol Banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="55%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#0d1115"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2A900"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#F2A900" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#2fbaa4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="15.5" fill="none" stroke="#2a2a30"/>
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#gold)"/>

  <!-- Subtle BlockDAG constellation on right -->
  <g stroke="#2a2a30" stroke-width="1.5" fill="none">
    <line x1="780" y1="130" x2="860" y2="75"/>
    <line x1="780" y1="130" x2="860" y2="185"/>
    <line x1="860" y1="75" x2="950" y2="105"/>
    <line x1="860" y1="185" x2="950" y2="105"/>
    <line x1="860" y1="185" x2="950" y2="175"/>
    <line x1="950" y1="105" x2="1045" y2="85"/>
    <line x1="950" y1="105" x2="1045" y2="145"/>
    <line x1="950" y1="175" x2="1045" y2="145"/>
    <line x1="1045" y1="85" x2="1125" y2="120"/>
    <line x1="1045" y1="145" x2="1125" y2="120"/>
  </g>
  <g>
    <circle cx="780" cy="130" r="8" fill="#1a1a1e" stroke="#8aa0b4" stroke-width="2"/>
    <circle cx="860" cy="75" r="9" fill="#1a1a1e" stroke="#2fbaa4" stroke-width="2"/>
    <circle cx="860" cy="185" r="8" fill="#1a1a1e" stroke="#8aa0b4" stroke-width="2"/>
    <circle cx="950" cy="105" r="11" fill="#F2A900" fill-opacity="0.2" stroke="#F2A900" stroke-width="2.2"/>
    <circle cx="950" cy="175" r="8" fill="#1a1a1e" stroke="#2fbaa4" stroke-width="2"/>
    <circle cx="1045" cy="85" r="9" fill="#1a1a1e" stroke="#F2A900" stroke-width="2"/>
    <circle cx="1045" cy="145" r="10" fill="#2fbaa4" fill-opacity="0.2" stroke="#2fbaa4" stroke-width="2"/>
    <circle cx="1125" cy="120" r="13" fill="#F2A900" fill-opacity="0.25" stroke="#F2A900" stroke-width="2.5"/>
    <circle cx="1125" cy="120" r="5" fill="#F2A900"/>
