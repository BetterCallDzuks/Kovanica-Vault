  <!-- Left Typography -->
  <text x="56" y="68" fill="#F2A900" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3.5">KOVANICA PROTOCOL · KVNC</text>
  <text x="56" y="130" fill="#f2f1ee" font-family="Georgia, serif" font-style="italic" font-size="54" font-weight="600">Kovanica</text>
  <text x="56" y="168" fill="#9a9aa3" font-family="system-ui, -apple-system, sans-serif" font-size="17">Hybrid PoW + GHOSTDAG Layer-1 · Deterministic Wasmi · Institutional KVP-106 RWA</text>

